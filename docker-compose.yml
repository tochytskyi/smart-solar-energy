# Run on the Raspberry Pi:
#   docker compose pull && docker compose up -d
#
# Set TAPO_IMAGE in .env (or edit the default below) to your GHCR image, e.g.
#   TAPO_IMAGE=ghcr.io/your-github-username/tapo:latest

services:
  tapo-watcher:
    image: ${TAPO_IMAGE:-ghcr.io/OWNER/tapo:latest}
    container_name: tapo-watcher

    # The plugs live on your LAN and are reached by raw IP. Host networking puts
    # the container on the Pi's own interface, so there is no NAT hop between it
    # and the plugs' local API. Linux-only, which is exactly what the Pi is.
    #
    # It also means the dashboard is simply http://<pi>:8080 - no port mapping.
    network_mode: host

    # Credentials and IPs come from .env at runtime - never from the image.
    env_file:
      - .env

    # The logbook the dashboard reads. Keeping it on the host means an image
    # update, or a `docker compose down`, does not throw the history away.
    volumes:
      - ./data:/app/data

    restart: unless-stopped
    stop_grace_period: 15s

    # The Pi's SD card will thank you.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional, and off unless asked for: docker compose --profile ngrok up -d
  #
  # This puts the dashboard - pause switch included - on a public address, so it
  # only ever runs behind Google sign-in limited to the addresses in
  # NGROK_OAUTH_EMAIL. ngrok checks the login at its edge; nothing reaches the
  # Pi until it has passed. An unset allow-list falls back to an address no one
  # owns, so a missing line in .env locks everybody out rather than letting
  # every Google account in. (Not `:?` - compose checks that on every service,
  # and it would stop the watcher starting on a Pi that never uses ngrok.)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: tapo-ngrok
    #profiles: ["ngrok"]

    # Same host network as the watcher, so the dashboard is just localhost and
    # works even with DASHBOARD_HOST=127.0.0.1 keeping it off the LAN.
    network_mode: host

    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}

    command:
      - "http"
      - "127.0.0.1:${DASHBOARD_PORT:-8080}"
      - "--url=https://${NGROK_DOMAIN:-inverter.ngrok.app}"
      - "--oauth=google"
      - "--oauth-allow-email=${NGROK_OAUTH_EMAIL:-nobody@invalid}"

    restart: unless-stopped
